# Render Blueprint Configuration for Planka (Free Tier Compatible)
# GitHub Fork: https://github.com/soojh007/planka
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: planka-app
    runtime: docker
    plan: free
    region: singapore
    envVars:
      - key: BASE_URL
        sync: false # Set to your live URL after deploy (e.g. https://planka-app.onrender.com)
      - key: DATABASE_URL
        fromDatabase:
          name: planka-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: TRUST_PROXY
        value: "true"
      - key: DEFAULT_ADMIN_EMAIL
        value: admin@example.com
      - key: DEFAULT_ADMIN_PASSWORD
        generateValue: true
      - key: DEFAULT_ADMIN_NAME
        value: "Admin"
      - key: DEFAULT_ADMIN_USERNAME
        value: "admin"

databases:
  - name: planka-db
    databaseName: planka
    user: planka
    plan: free
    region: singapore
